<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anlık Mesajlaşma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom {
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-zinc-900 transition-colors duration-200 antialiased overflow-hidden h-full w-screen flex flex-col justify-center items-center font-sans">

    <div id="login-screen" class="w-full max-w-md p-6 bg-white dark:bg-zinc-800 rounded-2xl shadow-xl text-center m-4 relative z-50">
        <div class="w-16 h-16 bg-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-4">
            <i class="fa-solid fa-comments"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-zinc-100 mb-2">Hoş Geldiniz</h1>
        <p class="text-gray-500 dark:text-zinc-400 text-sm mb-6">Lütfen giriş yapmak istediğiniz hesabı seçin.</p>
        <div class="space-y-3">
            <button onclick="window.selectUser('Mat Dehası')" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl transition active:scale-[0.98]">
                Mat Dehası Olarak Gir
            </button>
            <button onclick="window.selectUser('Biyolojinin Son Kalesi')" class="w-full py-3.5 bg-zinc-800 hover:bg-zinc-900 text-white font-semibold rounded-xl transition active:scale-[0.98]">
                Biyolojinin Son Kalesi Olarak Gir
            </button>
        </div>
    </div>

    <div id="chat-screen" class="hidden w-full h-full md:h-[92vh] max-w-7xl bg-white dark:bg-zinc-800 md:rounded-2xl md:shadow-2xl flex overflow-hidden relative">
        
        <div id="sidebar-area" class="w-full md:w-80 border-r border-gray-100 dark:border-zinc-700/50 flex flex-col bg-gray-50 dark:bg-zinc-800/50 shrink-0">
            <div class="h-16 px-4 border-b border-gray-100 dark:border-zinc-700/50 flex items-center justify-between bg-white dark:bg-zinc-800 shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold shrink-0"><i class="fa-solid fa-circle-user text-xl"></i></div>
                    <span id="current-user-name" class="font-bold text-gray-800 dark:text-zinc-100 text-sm truncate">Yükleniyor...</span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="fullscreen-btn" class="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-zinc-700 text-gray-600 dark:text-zinc-300" title="Tam Ekran">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <button id="dark-mode-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-zinc-700 text-gray-600 dark:text-zinc-300">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2">
                <div onclick="window.openChatArea()" class="flex items-center gap-3 p-3 bg-white dark:bg-zinc-700/40 rounded-xl border border-gray-100 dark:border-zinc-700/30 cursor-pointer hover:bg-gray-100/50 transition">
                    <div class="w-11 h-11 rounded-xl bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold flex items-center justify-center shrink-0" id="avatar-placeholder">-</div>
                    <div class="flex-1 min-w-0">
                        <h3 id="chat-partner-name" class="font-semibold text-gray-800 dark:text-zinc-200 text-sm truncate">Yükleniyor</h3>
                        <div id="partner-status-sidebar" class="text-xs text-gray-400 truncate mt-0.5">Durum alınıyor...</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="chat-area" class="hidden md:flex flex-1 flex-col bg-[#efeae2] dark:bg-zinc-900 relative h-full overflow-hidden">
            <div id="chat-bg-layer" class="absolute inset-0 opacity-[0.06] dark:opacity-[0.03] pointer-events-none" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat;"></div>

            <div class="h-16 px-4 bg-white dark:bg-zinc-800 border-b border-gray-100 dark:border-zinc-700/50 flex items-center justify-between relative z-10 shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="window.closeChatArea()" class="md:hidden w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-zinc-700 text-gray-600 dark:text-zinc-300 mr-1 shrink-0">
                        <i class="fa-solid fa-arrow-left text-base"></i>
                    </button>
                    <div class="relative shrink-0">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center"><i class="fa-solid fa-comments"></i></div>
                        <div id="status-indicator-dot" class="w-3 h-3 bg-gray-400 border-2 border-white dark:border-zinc-800 rounded-full absolute -bottom-0.5 -right-0.5"></div>
                    </div>
                    <div class="min-w-0 flex flex-col justify-center">
                        <h2 id="chat-header-partner-name" class="font-bold text-gray-800 dark:text-zinc-100 text-[15px] leading-tight truncate">Yükleniyor...</h2>
                        <div id="partner-status-header" class="text-xs text-gray-400 font-medium leading-tight mt-0.5">Yükleniyor...</div>
                    </div>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 relative z-10"></div>

            <div class="p-2.5 sm:p-3 bg-gray-50 dark:bg-zinc-800 border-t border-gray-100 dark:border-zinc-700/50 flex items-center gap-2 relative z-10 shrink-0 safe-bottom shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
                <label class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-zinc-700 text-gray-500 dark:text-zinc-300 border border-gray-200 dark:border-zinc-600 cursor-pointer active:scale-95 transition shrink-0 shadow-sm">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                    <input type="file" id="file-input" class="hidden">
                </label>

                <button id="voice-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-zinc-700 text-gray-500 dark:text-zinc-300 border border-gray-200 dark:border-zinc-600 active:scale-95 transition shrink-0 shadow-sm">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>

                <div class="flex-1 relative">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Bir mesaj yazın..." class="w-full h-10 pl-4 pr-4 bg-white dark:bg-zinc-700 border border-gray-200 dark:border-zinc-600 rounded-xl text-gray-800 dark:text-zinc-100 placeholder-gray-400 dark:placeholder-zinc-400 shadow-sm text-[15px] focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-400 transition-all">
                </div>

                <button id="send-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white shrink-0 shadow-md transition">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=2.2.0"></script>
</body>
</html>
