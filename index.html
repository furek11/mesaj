<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anlık Mesajlaşma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        whatsapp: {
                            dark: '#0b141a',
                            panel: '#1f2c34',
                            input: '#2a3942',
                            green: '#005c4b',
                            lightGreen: '#68dbaf',
                            mic: '#00a884',
                            received: '#202c33'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* WhatsApp Koyu Tema Arka Plan Deseni Simülasyonu */
        .wa-bg-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }
        /* Kaydırma çubuğu özelleştirmeleri */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-zinc-950 transition-colors duration-200 select-none overflow-hidden" id="app-container">

    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-zinc-900 px-4">
        <div class="w-full max-w-sm bg-zinc-800 p-8 rounded-2xl shadow-2xl text-center border border-zinc-700/50">
            <div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-emerald-900/30">
                <i class="fa-solid fa-comments text-4xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">KriptoChat v2</h1>
            <p class="text-zinc-400 text-sm mb-8">Lütfen giriş yapmak istediğiniz hesabı seçin</p>
            
            <div class="space-y-4">
                <button onclick="window.selectUser('Mat Dehası')" class="w-full bg-zinc-700 hover:bg-emerald-600 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-between group shadow-md">
                    <span class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-zinc-600 flex items-center justify-center font-bold text-sm group-hover:bg-emerald-500">M</span>
                        Mat Dehası
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-zinc-400 group-hover:text-white"></i>
                </button>
                <button onclick="window.selectUser('Biyolojinin Son Kalesi')" class="w-full bg-zinc-700 hover:bg-emerald-600 text-white font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-between group shadow-md">
                    <span class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-zinc-600 flex items-center justify-center font-bold text-sm group-hover:bg-emerald-500">B</span>
                        Biyolojinin Son Kalesi
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-zinc-400 group-hover:text-white"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="hidden h-full w-full flex overflow-hidden max-w-[1600px] mx-auto bg-white dark:bg-zinc-900 shadow-2xl relative">
        
        <div id="sidebar-area" class="w-full md:w-[350px] lg:w-[400px] flex-shrink-0 flex flex-col border-r border-gray-200 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-900 h-full">
            <div class="h-[60px] px-4 flex items-center justify-between bg-gray-100 dark:bg-zinc-800/60 border-b border-gray-200 dark:border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold shadow-sm" id="avatar-self">i</div>
                    <span class="font-bold text-gray-800 dark:text-zinc-100 text-sm truncate max-w-[140px]" id="current-user-name">Yükleniyor...</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="dark-mode-toggle" class="w-8 h-8 rounded-lg text-gray-600 dark:text-zinc-400 hover:bg-gray-200 dark:hover:bg-zinc-700 transition flex items-center justify-center">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                    </button>
                    <button id="fullscreen-btn" class="w-8 h-8 rounded-lg text-gray-600 dark:text-zinc-400 hover:bg-gray-200 dark:hover:bg-zinc-700 transition flex items-center justify-center">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <button id="close-tab-btn" class="w-8 h-8 rounded-lg text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-950/40 transition flex items-center justify-center">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div onclick="window.openChatArea()" class="flex items-center gap-3 p-3 bg-white dark:bg-zinc-800/40 rounded-xl cursor-pointer shadow-sm border border-gray-100 dark:border-zinc-800/80 hover:bg-gray-100 dark:hover:bg-zinc-800/80 transition relative">
                    <div class="w-11 h-11 rounded-full bg-zinc-500 dark:bg-zinc-700 flex items-center justify-center text-white font-bold text-lg shadow-inner" id="avatar-placeholder">-</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                            <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm truncate" id="chat-partner-name">Sohbet Partneri</span>
                            <div class="w-2.5 h-2.5 rounded-full bg-gray-400" id="status-indicator-dot"></div>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-zinc-400 truncate" id="partner-status-sidebar">çevrimdışı</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="chat-area" class="hidden md:flex flex-1 flex-col h-full relative bg-gray-100 dark:bg-zinc-950 wa-bg-pattern">
            
            <div class="h-[60px] px-4 flex items-center justify-between bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 shadow-sm z-10 flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="window.closeChatArea()" class="md:hidden text-gray-600 dark:text-zinc-400 p-1 -ml-1 hover:bg-gray-100 dark:hover:bg-zinc-800 rounded-lg">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h2 class="font-bold text-gray-800 dark:text-zinc-100 text-sm md:text-base truncate" id="chat-header-partner-name">-</h2>
                        <p class="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium truncate" id="partner-status-header">çevrimdışı</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-gray-500 dark:text-zinc-400 text-lg">
                    <button class="hover:text-gray-700 dark:hover:text-zinc-200 transition"><i class="fa-solid fa-video text-base"></i></button>
                    <button class="hover:text-gray-700 dark:hover:text-zinc-200 transition"><i class="fa-solid fa-phone text-sm"></i></button>
                    <div class="h-4 w-[1px] bg-gray-300 dark:bg-zinc-700 mx-1"></div>
                    <button class="hover:text-gray-700 dark:hover:text-zinc-200 transition"><i class="fa-solid fa-ellipsis-vertical text-base"></i></button>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-2 flex flex-col Wa-Style-Bubbles">
                </div>

            <div id="voice-status-panel" class="hidden absolute bottom-[60px] left-4 right-4 bg-white/95 dark:bg-zinc-900/95 backdrop-blur border border-emerald-500/20 shadow-xl rounded-xl p-3 flex items-center justify-between z-20 animate-slide-up">
                <div class="flex items-center gap-3">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    </span>
                    <span class="text-xs text-gray-600 dark:text-zinc-300 font-medium">Ses Kaydediliyor...</span>
                </div>
                <span id="voice-timer" class="text-sm font-mono font-bold text-emerald-600 dark:text-emerald-400">00:00</span>
            </div>

            <div class="p-3 bg-transparent flex items-center gap-2 z-10 flex-shrink-0">
                <div class="flex-1 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800/80 rounded-2xl flex items-center px-3 py-1.5 gap-2 shadow-sm relative">
                    <button class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-300 text-lg px-1"><i class="fa-regular fa-face-smile"></i></button>
                    
                    <label id="attach-label" for="file-input" class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-300 text-lg px-1 cursor-pointer">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">

                    <textarea id="message-input" rows="1" placeholder="Mesaj yazın..." class="flex-1 bg-transparent border-none outline-none text-gray-800 dark:text-zinc-100 text-sm max-h-24 resize-none placeholder-gray-400 py-1" style="height: 24px;"></textarea>
                </div>
                
                <div class="flex items-center gap-1">
                    <button id="voice-cancel-btn" class="hidden w-10 h-10 bg-rose-100 dark:bg-rose-950/40 text-rose-500 hover:bg-rose-200 dark:hover:bg-rose-900/60 rounded-full flex items-center justify-center transition shadow-sm">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button id="voice-btn" class="w-10 h-10 bg-emerald-600 text-white hover:bg-emerald-700 rounded-full flex items-center justify-center transition shadow-sm text-base">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button id="send-btn" class="w-10 h-10 bg-emerald-600 text-white hover:bg-emerald-700 rounded-full flex items-center justify-center transition shadow-sm text-base">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div id="image-preview-modal" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 p-4 backdrop-blur-sm animate-fade-in">
        <div class="absolute top-4 right-4 flex items-center gap-3">
            <button id="modal-download-btn" class="w-10 h-10 bg-zinc-800/80 hover:bg-zinc-700 text-white rounded-xl transition flex items-center justify-center text-lg shadow-md">
                <i class="fa-solid fa-download"></i>
            </button>
            <button id="modal-close-btn" class="w-10 h-10 bg-zinc-800/80 hover:bg-rose-600 text-white rounded-xl transition flex items-center justify-center text-lg shadow-md">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <img id="modal-preview-img" src="" alt="Önizleme" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
