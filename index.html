<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Mesajlaşma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          // EmailJS Public Key buraya gelecek
          emailjs.init("BURAYA_ACCOUNT_SEKMESINDEKI_PUBLIC_KEY_GELECEK"); 
       })();
    </script>
</head>
<body class="bg-gradient-to-r from-gray-100 to-gray-200 h-screen flex items-center justify-center font-sans overflow-hidden m-0 transition-colors duration-300 dark:from-zinc-900 dark:to-zinc-800">

    <div id="login-screen" class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-sm text-center border border-gray-100 transition-all duration-300 dark:bg-zinc-800 dark:border-zinc-700">
        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner dark:bg-emerald-900/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-emerald-600 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
        </div>
        <h2 class="text-2xl font-extrabold mb-2 text-gray-800 dark:text-white">Hoş Geldiniz</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Lütfen devam etmek için profilinizi seçin</p>
        <div class="flex flex-col gap-4">
            <button onclick="selectUser('Kullanıcı 1')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition duration-200 transform hover:-translate-y-0.5 shadow-md">
                Ben Kullanıcı 1
            </button>
            <button onclick="selectUser('Kullanıcı 2')" class="bg-zinc-700 hover:bg-zinc-800 text-white font-bold py-3 px-6 rounded-xl transition duration-200 transform hover:-translate-y-0.5 shadow-md dark:bg-zinc-600 dark:hover:bg-zinc-500">
                Ben Kullanıcı 2
            </button>
        </div>
    </div>

    <div id="chat-screen" class="hidden w-full h-full max-w-5xl md:h-[90vh] bg-white md:rounded-2xl shadow-2xl flex overflow-hidden border border-gray-200/50 dark:bg-zinc-800 dark:border-zinc-700/50">
        
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col dark:bg-zinc-800 dark:border-zinc-700">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center dark:bg-zinc-800/50 dark:border-zinc-700">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold shadow-md">S</div>
                    <span id="current-user-name" class="font-bold text-gray-700 dark:text-gray-200">Kullanıcı</span>
                </div>
            </div>
            
            <div class="flex-1 p-3 overflow-y-auto space-y-1">
                <div class="flex items-center gap-3 p-3 bg-emerald-50/60 hover:bg-emerald-50 rounded-xl cursor-pointer transition border border-emerald-100/30 dark:bg-zinc-700/30 dark:hover:bg-zinc-700/50 dark:border-zinc-600/30">
                    <div id="avatar-placeholder" class="w-12 h-12 bg-gradient-to-tr from-emerald-400 to-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-sm">M</div>
                    <div class="flex-1 min-w-0">
                        <h4 id="chat-partner-name" class="font-bold text-gray-800 dark:text-gray-200 truncate">Arkadaşım</h4>
                        <p id="partner-status-sidebar" class="text-xs text-gray-500 dark:text-gray-400 font-medium truncate mt-0.5">Çevrimdışı</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="chat-bg-layer" class="flex-1 flex flex-col bg-[#efeae2] relative transition-all duration-300 dark:bg-zinc-900" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; opacity: 0.98;">
            
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between shadow-sm z-10 dark:bg-zinc-800 dark:border-zinc-700">
                <div class="flex items-center gap-3">
                    <div id="status-indicator-dot" class="w-3 h-3 bg-gray-400 rounded-full transition-colors duration-300"></div>
                    <div class="flex flex-col">
                        <span id="chat-header-title" class="font-bold text-gray-800 text-sm leading-tight dark:text-white">Güvenli Sohbet Odası</span>
                        <span id="partner-status-header" class="text-xs text-gray-500 font-medium mt-0.5 dark:text-gray-400">Son görülme bilinmiyor</span>
                    </div>
                </div>
                <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-zinc-700 text-gray-600 dark:text-gray-300 transition">
                    <svg id="dark-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </div>

            <div id="messages-container" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col scroll-smooth"></div>

            <div class="p-4 bg-gray-50 flex items-center gap-2 border-t border-gray-200 shadow-inner z-10 dark:bg-zinc-800 dark:border-zinc-700">
                
                <label class="cursor-pointer p-2.5 text-gray-500 hover:text-emerald-600 hover:bg-gray-200 dark:hover:bg-zinc-700 rounded-full transition shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                    <input id="file-input" type="file" accept="image/*, application/pdf" class="hidden">
                </label>

                <button id="voice-btn" class="p-2.5 text-gray-500 hover:text-red-500 hover:bg-gray-200 dark:hover:bg-zinc-700 rounded-full transition shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                </button>

                <input id="message-input" type="text" placeholder="Bir mesaj yazın..." class="flex-1 p-2.5 px-5 rounded-full border border-gray-300 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 bg-white shadow-sm text-sm transition duration-150 dark:bg-zinc-700 dark:border-zinc-600 dark:text-white dark:focus:ring-emerald-900/30">
                
                <button id="send-btn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold p-2.5 px-5 rounded-full shadow-md transition duration-150 flex items-center justify-center shrink-0">
                    <svg xmlns="http://www.w3.org/2000/xl" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                </button>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
