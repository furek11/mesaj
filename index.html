<!DOCTYPE html>
<html lang="tr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anlık Mesajlaşma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY"); // EmailJS Public Key'inizi buraya yazabilirsiniz
        })();
    </script>
</head>
<body class="bg-gray-100 dark:bg-zinc-900 transition-colors duration-200 antialiased overflow-hidden h-screen w-screen flex flex-col justify-center items-center font-sans selection:bg-emerald-500 selection:text-white">

    <div id="login-screen" class="w-full max-w-md p-6 bg-white dark:bg-zinc-800 rounded-2xl shadow-xl border border-gray-100 dark:border-zinc-700/50 text-center m-4 transition-all duration-300">
        <div class="w-16 h-16 bg-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg shadow-emerald-200 dark:shadow-none mb-4 animate-bounce">
            <i class="fa-solid fa-comments"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-zinc-100 mb-2">Hoş Geldiniz</h1>
        <p class="text-gray-500 dark:text-zinc-400 text-sm mb-6">Lütfen giriş yapmak istediğiniz kullanıcıyı seçin.</p>
        <div class="space-y-3">
            <button onclick="window.selectUser('Kullanıcı 1')" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-semibold rounded-xl shadow-md shadow-emerald-100 dark:shadow-none transition-all duration-200 flex items-center justify-center gap-3">
                <i class="fa-solid fa-user-tie"></i> Kullanıcı 1 Olarak Gir
            </button>
            <button onclick="window.selectUser('Kullanıcı 2')" class="w-full py-3.5 bg-zinc-800 hover:bg-zinc-900 dark:bg-zinc-700 dark:hover:bg-zinc-600 active:scale-[0.98] text-white font-semibold rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-3">
                <i class="fa-solid fa-user-ninja"></i> Kullanıcı 2 Olarak Gir
            </button>
        </div>
    </div>

    <div id="chat-screen" class="hidden w-full h-screen max-w-7xl md:h-[92vh] bg-white dark:bg-zinc-800 md:rounded-2xl md:shadow-2xl md:border md:border-gray-100 md:dark:border-zinc-700/50 flex overflow-hidden relative transition-all duration-300">
        
        <div class="w-80 border-r border-gray-100 dark:border-zinc-700/50 flex flex-col bg-gray-50 dark:bg-zinc-800/50 sidebar shrink-0 md:flex">
            <div class="h-16 px-4 border-b border-gray-100 dark:border-zinc-700/50 flex items-center justify-between bg-white dark:bg-zinc-800 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm" id="current-user-avatar">
                        <i class="fa-solid fa-circle-user text-xl"></i>
                    </div>
                    <span id="current-user-name" class="font-bold text-gray-800 dark:text-zinc-100 text-sm">Yükleniyor...</span>
                </div>
                <button id="dark-mode-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-zinc-700 text-gray-600 dark:text-zinc-300 hover:bg-gray-200 dark:hover:bg-zinc-600 transition" title="Temayı Değiştir">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div onclick="window.applyMobileView('chat')" class="flex items-center gap-3 p-3 bg-white dark:bg-zinc-700/40 rounded-xl border border-emerald-500/10 dark:border-emerald-400/5 shadow-sm cursor-pointer hover:bg-white/80 dark:hover:bg-zinc-700/60 transition group">
                    <div class="w-11 h-11 rounded-xl bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold text-lg flex items-center justify-center shadow-inner group-hover:scale-105 transition duration-200" id="avatar-placeholder">-</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h3 id="chat-partner-name" class="font-semibold text-gray-800 dark:text-zinc-200 text-sm truncate">Sohbet Yükleniyor</h3>
                        </div>
                        <div id="partner-status-sidebar" class="text-xs text-gray-400 truncate mt-0.5">Durum alınıyor...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-[#efeae2] dark:bg-zinc-900 relative chat-area hidden md:flex">
            <div id="chat-bg-layer" class="absolute inset-0 opacity-[0.06] dark:opacity-[0.03] pointer-events-none" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; background-blend-mode: overlay;"></div>

            <div class="h-16 px-4 bg-white dark:bg-zinc-800 border-b border-gray-100 dark:border-zinc-700/50 flex items-center justify-between relative z-10 shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="window.backToSidebar()" class="md:hidden w-8 h-8 -ml-1 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-zinc-700 text-gray-600 dark:text-zinc-300 transition" title="Sohbetlere Dön">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    
                    <div class="relative">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center shadow-md shadow-emerald-100 dark:shadow-none"><i class="fa-solid fa-comments"></i></div>
                        <div id="status-indicator-dot" class="w-3 h-3 bg-gray-400 border-2 border-white dark:border-zinc-800 rounded-full absolute -bottom-0.5 -right-0.5 transition-all duration-300"></div>
                    </div>
                    <div class="min-w-0">
                        <div id="partner-status-header" class="text-xs text-gray-400 font-medium mt-0.5">Durum yükleniyor...</div>
                    </div>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-3 relative z-10 scroll-smooth">
                </div>

            <div class="p-3 bg-gray-50 dark:bg-zinc-800 border-t border-gray-100 dark:border-zinc-700/50 flex items-center gap-2 relative z-10 shrink-0">
                <label class="w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-xl bg-white dark:bg-zinc-700 text-gray-500 dark:text-zinc-300 border border-gray-200 dark:border-zinc-600 cursor-pointer hover:bg-gray-100 dark:hover:bg-zinc-600 active:scale-95 transition shrink-0" title="Dosya veya Fotoğraf Yükle">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                    <input type="file" id="file-input" class="hidden">
                </label>

                <button id="voice-btn" class="w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-xl bg-white dark:bg-zinc-700 text-gray-500 dark:text-zinc-300 border border-gray-200 dark:border-zinc-600 hover:bg-gray-100 dark:hover:bg-zinc-600 active:scale-95 transition shrink-0" title="Sesli Mesaj Kaydet">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>

                <div class="flex-1 relative">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Bir mesaj yazın..." class="w-full h-10 md:h-11 pl-4 pr-4 bg-white dark:bg-zinc-700 border border-gray-200 dark:border-zinc-600 rounded-xl focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-400 text-gray-800 dark:text-zinc-100 placeholder-gray-400 dark:placeholder-zinc-400 shadow-sm text-[14px] md:text-[15px]">
                </div>

                <button id="send-btn" class="w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white shadow-md shadow-emerald-100 dark:shadow-none active:scale-95 transition shrink-0" title="Mesajı Gönder">
                    <i class="fa-solid fa-paper-plane text-sm md:text-base"></i>
                </button>
            </div>

        </div>
    </div>

    <script type="module" src="app.js?v=1.0.2"></script>
</body>
</html>
